<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
body { background: #f4f7fb; padding: 8px; }

.banner {
    background: linear-gradient(135deg,#1a3a5c,#2e6da4);
    padding: 20px 24px; border-radius: 10px; margin-bottom: 20px;
}
.banner .title { color: #fff; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.banner .subtitle { color: #b8d4f0; font-size: 13px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 16px; }
.grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
.grid-2i { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.section-bar {
    background: #1a3a5c; color: white; padding: 7px 12px;
    border-radius: 6px; font-size: 11px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px;
}

.field { margin-bottom: 11px; }
.field label { display: block; font-size: 12px; font-weight: 700; color: #1a3a5c; margin-bottom: 3px; }

.mic-row { display: flex; gap: 5px; align-items: center; }
.mic-row input, .mic-row select { flex: 1; }

input[type=text], input[type=number], select {
    width: 100%; padding: 7px 10px; border: 1px solid #b8cfe8;
    border-radius: 6px; font-size: 13px; color: #1a3a5c;
    background: white; outline: none;
}
input:focus, select:focus { border-color: #1a3a5c; }

.mic {
    padding: 6px 9px; background: #eaf1fb; border: 1px solid #b8cfe8;
    border-radius: 6px; cursor: pointer; font-size: 14px; flex-shrink: 0;
    line-height: 1; transition: background 0.15s;
}
.mic:hover { background: #d0e3f5; }
.mic.on { background: #dce8f5; border-color: #1a3a5c; }
.mic-status { font-size: 10px; color: #2e6da4; min-height: 13px; margin-top: 2px; }

.pain-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.pain-row label { font-size: 13px; font-weight: 600; color: #1a3a5c; }
input[type=range] { accent-color: #1a3a5c; flex: 1; }
.pain-val { font-weight: 700; color: #1a3a5c; font-size: 13px; min-width: 28px; }

.lang-bar {
    background: #1a3a5c; color: white; padding: 7px 12px;
    border-radius: 6px; font-size: 11px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px;
}
.lang-row { display: flex; gap: 20px; margin-bottom: 14px; }
.lang-row label { display: flex; align-items: center; gap: 5px; font-size: 13px; color: #1a3a5c; font-weight: 600; cursor: pointer; }

.run-btn {
    padding: 12px 32px; background: #1a3a5c; color: white;
    border: none; border-radius: 8px; font-size: 15px; font-weight: 700;
    cursor: pointer; letter-spacing: 0.5px; transition: background 0.2s;
    white-space: nowrap;
}
.run-btn:hover { background: #0f2540; }
.run-btn:active { background: #2e6da4; }

.error {
    background: #dce8f5; border-left: 4px solid #1a3a5c;
    border-radius: 6px; padding: 10px 14px; color: #1a3a5c;
    font-size: 13px; margin-top: 10px; display: none;
}
</style>
</head>
<body>

<div class="banner">
    <div class="title">🏥 PhysioAI — Clinical Assessment Tool</div>
    <div class="subtitle">AI-assisted physiotherapy screening</div>
</div>

<div class="grid-2">
  <!-- LEFT -->
  <div>
    <div class="section-bar">① Patient Profile</div>
    <div class="grid-4">
      <div class="field"><label>Age (years)</label><input type="number" id="age" value="45" min="1" max="120"></div>
      <div class="field"><label>Gender</label>
        <select id="gender">
          <option>Male</option><option selected>Female</option>
          <option>Non-binary</option><option>Prefer not to say</option>
        </select>
      </div>
      <div class="field"><label>Weight (kg)</label><input type="number" id="weight" value="68"></div>
      <div class="field"><label>Height (cm)</label><input type="number" id="height" value="165"></div>
    </div>
    <div class="field">
      <label>Occupation</label>
      <div class="mic-row">
        <input type="text" id="occupation" placeholder="e.g. Office worker, nurse..." autocomplete="new-password">
        <button class="mic" id="mic_occupation" onclick="toggleMic('occupation')">🎤</button>
      </div>
      <div class="mic-status" id="st_occupation"></div>
    </div>
    <div class="field">
      <label>Physical Activity Level</label>
      <div class="mic-row">
        <input type="text" id="physical_activity" placeholder="e.g. Sedentary, walks daily..." autocomplete="new-password">
        <button class="mic" id="mic_physical_activity" onclick="toggleMic('physical_activity')">🎤</button>
      </div>
      <div class="mic-status" id="st_physical_activity"></div>
    </div>

    <div class="section-bar" style="margin-top:10px;">③ Symptoms</div>
    <div class="pain-row">
      <input type="checkbox" id="has_pain" checked onchange="togglePain()">
      <label for="has_pain">Pain is present</label>
    </div>
    <div id="pain_block" class="field">
      <label>Pain Intensity: <span id="pain_val">5</span>/10</label>
      <input type="range" id="pain_intensity" min="0" max="10" value="5"
        oninput="document.getElementById('pain_val').innerText=this.value">
    </div>
    <div class="field">
      <label>What makes it worse?</label>
      <div class="mic-row">
        <input type="text" id="aggravating" placeholder="e.g. Walking, sitting too long..." autocomplete="new-password">
        <button class="mic" id="mic_aggravating" onclick="toggleMic('aggravating')">🎤</button>
      </div>
      <div class="mic-status" id="st_aggravating"></div>
    </div>
    <div class="field">
      <label>What makes it better?</label>
      <div class="mic-row">
        <input type="text" id="relieving" placeholder="e.g. Rest, heat, ice..." autocomplete="new-password">
        <button class="mic" id="mic_relieving" onclick="toggleMic('relieving')">🎤</button>
      </div>
      <div class="mic-status" id="st_relieving"></div>
    </div>
  </div>

  <!-- RIGHT -->
  <div>
    <div class="section-bar">② Main Complaint</div>
    <div class="field">
      <label>Describe the patient's main problem *</label>
      <div class="mic-row">
        <input type="text" id="main_complaint" placeholder="e.g. Difficulty walking after knee surgery..." autocomplete="new-password">
        <button class="mic" id="mic_main_complaint" onclick="toggleMic('main_complaint')">🎤</button>
      </div>
      <div class="mic-status" id="st_main_complaint"></div>
    </div>
    <div class="field">
      <label>Body Area Affected *</label>
      <div class="mic-row">
        <input type="text" id="body_area" placeholder="e.g. Left knee, lower back..." autocomplete="new-password">
        <button class="mic" id="mic_body_area" onclick="toggleMic('body_area')">🎤</button>
      </div>
      <div class="mic-status" id="st_body_area"></div>
    </div>
    <div class="grid-2i">
      <div class="field">
        <label>How long has this problem existed?</label>
        <div class="mic-row">
          <input type="text" id="problem_duration" placeholder="e.g. 2 weeks, 6 months..." autocomplete="new-password">
          <button class="mic" id="mic_problem_duration" onclick="toggleMic('problem_duration')">🎤</button>
        </div>
        <div class="mic-status" id="st_problem_duration"></div>
      </div>
      <div class="field">
        <label>How did the problem start?</label>
        <select id="problem_onset">
          <option>Sudden (accident / injury)</option>
          <option>Gradual (developed over time)</option>
          <option>After surgery</option>
          <option>After illness</option>
          <option>Unknown / no clear cause</option>
        </select>
      </div>
    </div>

    <div class="section-bar" style="margin-top:10px;">④ Clinical History</div>
    <div class="field">
      <label>Previous injuries, surgeries or medical conditions</label>
      <div class="mic-row">
        <input type="text" id="previous_history" placeholder="e.g. Knee surgery 2022, diabetes..." autocomplete="new-password">
        <button class="mic" id="mic_previous_history" onclick="toggleMic('previous_history')">🎤</button>
      </div>
      <div class="mic-status" id="st_previous_history"></div>
    </div>
    <div class="field">
      <label>Current treatments or medications</label>
      <div class="mic-row">
        <input type="text" id="current_treatments" placeholder="e.g. Taking ibuprofen, wearing a brace..." autocomplete="new-password">
        <button class="mic" id="mic_current_treatments" onclick="toggleMic('current_treatments')">🎤</button>
      </div>
      <div class="mic-status" id="st_current_treatments"></div>
    </div>
    <div class="field">
      <label>Any other relevant information</label>
      <div class="mic-row">
        <input type="text" id="additional_info" placeholder="e.g. Patient goals, sport they want to return to..." autocomplete="new-password">
        <button class="mic" id="mic_additional_info" onclick="toggleMic('additional_info')">🎤</button>
      </div>
      <div class="mic-status" id="st_additional_info"></div>
    </div>
  </div>
</div>

<div style="display:flex; gap:40px; align-items:flex-start; margin-top:4px;">
  <div style="flex:1;">
    <div class="lang-bar">⑤ Response Language</div>
    <div class="lang-row">
      <label><input type="radio" name="lang" value="English" checked> English</label>
      <label><input type="radio" name="lang" value="Spanish"> Spanish</label>
      <label><input type="radio" name="lang" value="Finnish"> Finnish</label>
    </div>
  </div>
  <div style="padding-top:4px;">
    <div style="height:29px;"></div>
    <button class="run-btn" onclick="submit()">🔍 Run AI Assessment</button>
  </div>
</div>
<div class="error" id="error_msg">⚠️ Please fill in Main Complaint and Body Area Affected.</div>

<script>
// ── Streamlit component API ───────────────────────────────
function sendToStreamlit(data) {
    window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: data
    }, "*");
}

// Tell Streamlit we are ready and set initial height
function sendReady() {
    window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:componentReady",
        apiVersion: 1
    }, "*");
}

function updateHeight() {
    var h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight, 900);
    window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: h
    }, "*");
}

// Fire multiple times to ensure height is set
sendReady();
updateHeight();
window.addEventListener("load", function() {
    sendReady();
    updateHeight();
    setTimeout(updateHeight, 300);
    setTimeout(updateHeight, 800);
});

// ── Pain toggle ───────────────────────────────────────────
function togglePain() {
    document.getElementById('pain_block').style.display =
        document.getElementById('has_pain').checked ? 'block' : 'none';
    updateHeight();
}

// ── Microphone ────────────────────────────────────────────
var activeRec = null;
var activeField = null;

function toggleMic(fieldId) {
    if (activeRec) {
        activeRec.stop();
        activeRec = null;
        if (activeField !== fieldId) startMic(fieldId);
        return;
    }
    startMic(fieldId);
}

function startMic(fieldId) {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        document.getElementById('st_' + fieldId).innerText = '⚠️ Use Chrome or Edge';
        return;
    }
    var SR  = window.SpeechRecognition || window.webkitSpeechRecognition;
    var rec = new SR();
    rec.lang           = navigator.language || 'en-US';
    rec.continuous     = true;
    rec.interimResults = true;
    activeRec   = rec;
    activeField = fieldId;

    var btn    = document.getElementById('mic_' + fieldId);
    var status = document.getElementById('st_' + fieldId);
    var field  = document.getElementById(fieldId);
    var existing = field.value;

    btn.innerText = '⏹';
    btn.classList.add('on');
    status.innerText = '🔴 Listening... click ⏹ to stop';

    rec.onresult = function(e) {
        var interim = '', final = '';
        for (var i = e.resultIndex; i < e.results.length; i++) {
            if (e.results[i].isFinal) final += e.results[i][0].transcript;
            else interim += e.results[i][0].transcript;
        }
        var sep = (existing && !existing.endsWith(' ')) ? ' ' : '';
        field.value = existing + sep + final;
        if (final) existing = field.value;
        status.innerText = interim ? '💬 ' + interim : '🔴 Listening...';
    };

    rec.onend = function() {
        activeRec = null; activeField = null;
        btn.innerText = '🎤';
        btn.classList.remove('on');
        status.innerText = '✅ Done';
        setTimeout(function() { status.innerText = ''; }, 2000);
    };

    rec.onerror = function(e) {
        activeRec = null; activeField = null;
        btn.innerText = '🎤';
        btn.classList.remove('on');
        status.innerText = '⚠️ ' + e.error;
    };

    rec.start();
}

// ── Submit ────────────────────────────────────────────────
function submit() {
    var main_complaint = document.getElementById('main_complaint').value.trim();
    var body_area      = document.getElementById('body_area').value.trim();

    if (!main_complaint || !body_area) {
        document.getElementById('error_msg').style.display = 'block';
        updateHeight();
        return;
    }
    document.getElementById('error_msg').style.display = 'none';

    sendToStreamlit({
        submitted:         true,
        age:               parseInt(document.getElementById('age').value),
        gender:            document.getElementById('gender').value,
        weight:            parseFloat(document.getElementById('weight').value),
        height:            parseFloat(document.getElementById('height').value),
        occupation:        document.getElementById('occupation').value,
        physical_activity: document.getElementById('physical_activity').value,
        main_complaint:    main_complaint,
        body_area:         body_area,
        problem_duration:  document.getElementById('problem_duration').value,
        problem_onset:     document.getElementById('problem_onset').value,
        has_pain:          document.getElementById('has_pain').checked,
        pain_intensity:    parseInt(document.getElementById('pain_intensity').value),
        aggravating:       document.getElementById('aggravating').value,
        relieving:         document.getElementById('relieving').value,
        previous_history:  document.getElementById('previous_history').value,
        current_treatments:document.getElementById('current_treatments').value,
        additional_info:   document.getElementById('additional_info').value,
        language:          document.querySelector('input[name=lang]:checked').value
    });
}
</script>
</body>
</html>
